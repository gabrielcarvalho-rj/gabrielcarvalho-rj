<text x="130" y="48" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5" fill="#87B6CC">PROJETO  /  01</text>
<text x="38" y="111" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700" letter-spacing="-1" fill="#F0F7FC">Desvio <tspan fill="#6CDDC3">RJ</tspan></text>
<text x="39" y="145" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#C4D5E4">Descubra lugares. Planeje passeios.</text>
<text x="39" y="184" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#93B2C8">React  •  Spring Boot  •  PostgreSQL</text>
