<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="256" viewBox="0 0 1200 256" role="img" aria-labelledby="title desc">
<title id="title">Desvio RJ: versão acadêmica pública e V2 privada em evolução</title>
<desc id="desc">Projeto de descoberta de lugares e planejamento de passeios no Rio de Janeiro. O código acadêmico é público; a V2 está sendo desenvolvida e ainda não tem demonstração pública.</desc>
